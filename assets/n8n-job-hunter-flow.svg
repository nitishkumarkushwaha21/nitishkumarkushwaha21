<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94A3B8"/>
    </marker>
  </defs>
  <rect width="800" height="460" rx="18" fill="#0B1120"/>
  <text x="40" y="52" fill="#F8FAFC" font-size="22" font-weight="700">n8n Job Hunter</text>
  <text x="40" y="78" fill="#94A3B8" font-size="14">Hourly pipeline · AI screens, code decides</text>

  <!-- Row 1 -->
  <g font-size="14">
    <rect x="40" y="112" width="200" height="92" rx="12" fill="#111827" stroke="#334155"/>
    <text x="60" y="142" fill="#C4B5FD" font-size="12" font-weight="700" letter-spacing="1">1 · COLLECT</text>
    <text x="60" y="166" fill="#F8FAFC">7 sources: YC, RemoteOK,</text>
    <text x="60" y="186" fill="#94A3B8">WWR, Himalayas + ATS</text>

    <rect x="300" y="112" width="200" height="92" rx="12" fill="#111827" stroke="#334155"/>
    <text x="320" y="142" fill="#C4B5FD" font-size="12" font-weight="700" letter-spacing="1">2 · PRE-FILTER</text>
    <text x="320" y="166" fill="#F8FAFC">Regex on title + location</text>
    <text x="320" y="186" fill="#94A3B8">No AI spent on misses</text>

    <rect x="560" y="112" width="200" height="92" rx="12" fill="#111827" stroke="#334155"/>
    <text x="580" y="142" fill="#C4B5FD" font-size="12" font-weight="700" letter-spacing="1">3 · DEDUPLICATE</text>
    <text x="580" y="166" fill="#F8FAFC">Skip jobs in "Seen" tab</text>
    <text x="580" y="186" fill="#94A3B8">Google Sheets as state</text>
  </g>

  <!-- Row 2 -->
  <g font-size="14">
    <rect x="560" y="268" width="200" height="92" rx="12" fill="#1E1B4B" stroke="#7C3AED"/>
    <text x="580" y="298" fill="#C4B5FD" font-size="12" font-weight="700" letter-spacing="1">4 · AI SCREEN</text>
    <text x="580" y="322" fill="#F8FAFC">Gemini, batches of 12</text>
    <text x="580" y="342" fill="#94A3B8">Fit · experience · ₹ salary</text>

    <rect x="300" y="268" width="200" height="92" rx="12" fill="#052E2B" stroke="#10B981"/>
    <text x="320" y="298" fill="#6EE7B7" font-size="12" font-weight="700" letter-spacing="1">5 · RULES IN CODE</text>
    <text x="320" y="322" fill="#F8FAFC">Code makes the final call</text>
    <text x="320" y="342" fill="#94A3B8">Failed AI calls retry hourly</text>

    <rect x="40" y="268" width="200" height="92" rx="12" fill="#111827" stroke="#334155"/>
    <text x="60" y="298" fill="#C4B5FD" font-size="12" font-weight="700" letter-spacing="1">6 · NOTIFY</text>
    <text x="60" y="322" fill="#F8FAFC">Matches → "Jobs" sheet</text>
    <text x="60" y="342" fill="#94A3B8">One HTML email per run</text>
  </g>

  <g stroke="#94A3B8" stroke-width="2" fill="none" marker-end="url(#a)">
    <line x1="244" y1="158" x2="294" y2="158"/>
    <line x1="504" y1="158" x2="554" y2="158"/>
    <path d="M660 208 L660 262"/>
    <line x1="556" y1="314" x2="506" y2="314"/>
    <line x1="296" y1="314" x2="246" y2="314"/>
  </g>

  <text x="40" y="414" fill="#64748B" font-size="13">n8n · Google Gemini API · Google Sheets API · Gmail SMTP · Docker</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
